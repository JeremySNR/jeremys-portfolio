name: Sync blog posts

# Pulls posts from github.com/JeremySNR/JeremySNR.github.io into
# src/app/blog/posts and commits any changes to main. Vercel then redeploys.

on:
  schedule:
    - cron: "17 */6 * * *" # every six hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-blog
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Sync posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync:blog

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet -- src/app/blog/posts; then
            echo "No new or changed posts."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/blog/posts
          git commit -m "Sync posts from jeremysnr.github.io"
          git push origin main
